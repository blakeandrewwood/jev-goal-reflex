<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jev-goal-reflex</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="m-0 overflow-hidden bg-neutral-900 text-neutral-100">
    <canvas id="scene" class="block h-screen w-screen"></canvas>

    <div id="hud" class="absolute top-4 left-4 min-w-64 whitespace-pre rounded-lg bg-neutral-800/80 p-3 font-mono text-xs">
      connecting…
    </div>

    <aside class="absolute top-4 right-4 flex max-h-[calc(100vh-9rem)] w-96 flex-col gap-3 rounded-lg bg-neutral-800/80 p-3 text-xs">
      <section>
        <h2 class="mb-1 font-semibold uppercase tracking-wide text-neutral-400">Plan</h2>
        <p id="plan-text" class="text-sm text-neutral-100">—</p>
        <ol id="plan-steps" class="mt-1 font-mono text-neutral-300"></ol>
      </section>
      <section class="flex min-h-0 flex-col">
        <h2 class="mb-1 font-semibold uppercase tracking-wide text-neutral-400">Jev state</h2>
        <pre id="jev-state" class="overflow-auto font-mono text-neutral-300">—</pre>
      </section>
      <section class="flex min-h-0 flex-col">
        <h2 class="mb-1 font-semibold uppercase tracking-wide text-neutral-400">Jev questions</h2>
        <pre id="jev-questions" class="overflow-auto font-mono text-neutral-300">—</pre>
      </section>
      <section class="flex min-h-0 flex-col">
        <h2 class="mb-1 font-semibold uppercase tracking-wide text-neutral-400">Jev response</h2>
        <pre id="jev-response" class="overflow-auto font-mono text-neutral-300">—</pre>
      </section>
    </aside>

    <div class="absolute bottom-6 left-4 flex w-56 flex-col gap-3 rounded-lg bg-neutral-800/80 p-3 text-xs">
      <label class="flex flex-col gap-1">
        <span class="flex justify-between">
          <span class="font-semibold uppercase tracking-wide text-neutral-400">Speed</span>
          <span id="speed-value" class="font-mono text-neutral-100">—</span>
        </span>
        <input id="speed" type="range" min="1" max="16" step="0.5" class="accent-orange-500" />
      </label>
      <label class="flex flex-col gap-1">
        <span class="flex justify-between">
          <span class="font-semibold uppercase tracking-wide text-neutral-400">Turn rate</span>
          <span id="turn-rate-value" class="font-mono text-neutral-100">—</span>
        </span>
        <input id="turn-rate" type="range" min="30" max="360" step="10" class="accent-orange-500" />
      </label>
    </div>

    <form id="instructions-form" class="absolute bottom-6 left-1/2 w-full max-w-2xl -translate-x-1/2 px-4">
      <input
        id="instructions-input"
        class="w-full rounded-2xl bg-neutral-800 px-5 py-4 text-sm text-neutral-100 shadow-lg ring-1 ring-neutral-700 outline-none placeholder:text-neutral-500 focus:ring-neutral-500"
        placeholder="Tell the player what to do…"
        autocomplete="off"
      />
    </form>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
